<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="atlas-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#0047ff" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Precision Architectural Grid Lines -->
  <line x1="64" y1="16" x2="64" y2="112" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 3" />
  <line x1="20" y1="64" x2="108" y2="64" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="64" cy="64" r="38" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Monogram A / Geometric Compass -->
  <!-- Left Leg -->
  <line x1="64" y1="28" x2="32" y2="100" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
  <!-- Right Leg -->
  <line x1="64" y1="28" x2="96" y2="100" stroke="#f8fafc" stroke-width="7" stroke-linecap="round" />
  <!-- Architectural Crossbar -->
  <line x1="44" y1="74" x2="84" y2="74" stroke="url(#atlas-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Apex Compass Needle / Beacon -->
  <circle cx="64" cy="28" r="6.5" fill="#0047ff" filter="url(#glow)" />
  <circle cx="64" cy="28" r="3" fill="#ffffff" />

  <!-- Coordinate Accent Marks -->
  <circle cx="32" cy="100" r="3.5" fill="#38bdf8" />
  <circle cx="96" cy="100" r="3.5" fill="#38bdf8" />
</svg>
